name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy-stage:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Desplegar en VPS (Staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/nvf-sports-stage/payments-ms-01
            git stash
            git pull origin develop
            git stash drop 2>/dev/null || true
            OLD_IMAGE_VERSION=$(grep "^IMAGE_VERSION=" .env | cut -d= -f2)
            IMAGE_NAME=$(grep "^IMAGE_NAME=" .env | cut -d= -f2)
            export IMAGE_VERSION=$(git rev-parse --short HEAD)
            export GITHUB_TOKEN=$(cat /etc/nvf/build-secrets/github_token)
            for attempt in 1 2 3; do
              docker compose build --no-cache && break
              echo "Build attempt $attempt failed, retrying in 15s..."
              sleep 15
            done
            docker compose up -d --force-recreate --remove-orphans
            unset GITHUB_TOKEN
            sed -i "s/^IMAGE_VERSION=.*/IMAGE_VERSION=${IMAGE_VERSION}/" .env
            docker images "${IMAGE_NAME}" --format "{{.Tag}}" \
              | grep -vE "^(${IMAGE_VERSION}|${OLD_IMAGE_VERSION}|<none>)$" \
              | xargs -r -I{} docker rmi "${IMAGE_NAME}:{}" 2>/dev/null || true
            docker image prune -f
