server:
  port: 8082
  host: "localhost"
  context-path: "/payments-ms"
  goEnv: "local"

database:
  mysql:
    name: "payments_ms"
    host: "localhost"
    port: 3306
    user: "root"
    password: "123456"
    maxOpenConns: 100
    maxIdleConns: 20
    connMaxLifetime: 4h
    connMaxIdleTime: 30m

golang-migrate:
  mysql:
    enabled: true
    locations: migrations/mysql

data:
  redis:
    host: "localhost"
    port: "6379"
    password: ""
    db: 1
    pool-size: 10

mercadopago:
  access_token: "TEST-your-access-token-here"
  webhook_secret: "your-webhook-secret-here"
  base_url: "https://api.mercadopago.com"
  notification_url: "https://your-domain.com/payments-ms/api/payments/webhook"
